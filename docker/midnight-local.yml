# A local Midnight network for developing and demoing the ZK login.
#
# bboard-cli's compose.yml is driven by testcontainers, which assigns random
# host ports. A browser DApp needs stable endpoints, so this pins them:
#
#   node          ws://localhost:9944
#   indexer       http://localhost:8088/api/v4/graphql
#   proof server  http://localhost:6300
#
# The node runs the "dev" preset, which funds a genesis wallet — no faucet and
# no tDUST required.
#
#   docker compose -f docker/midnight-local.yml up -d
#   docker compose -f docker/midnight-local.yml down

services:
  proof-server:
    image: midnightntwrk/proof-server:8.0.3
    command: ["midnight-proof-server", "-v"]
    container_name: painpath-proof-server
    ports:
      - "6300:6300"

  node:
    image: midnightntwrk/midnight-node:0.22.3
    container_name: painpath-node
    ports:
      - "9944:9944"
    environment:
      CFG_PRESET: "dev"
      SIDECHAIN_BLOCK_BENEFICIARY: "04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9944/health"]
      interval: 2s
      timeout: 5s
      retries: 5
      start_period: 40s

  indexer:
    image: midnightntwrk/indexer-standalone:4.0.1
    container_name: painpath-indexer
    ports:
      - "8088:8088"
    environment:
      RUST_LOG: "indexer=info,chain_indexer=info,indexer_api=info,wallet_indexer=info,indexer_common=info,fastrace_opentelemetry=info,info"
      # Only present to satisfy the config schema for the standalone indexer.
      # Not a secret and not used for anything security-relevant.
      APP__INFRA__SECRET: "303132333435363738393031323334353637383930313233343536373839303132"
      APP__INFRA__NODE__URL: "ws://node:9944"
    depends_on:
      node:
        condition: service_started
